        email: { type: string, format: email }
        password: { type: string }
        role: { type: string }
        branchId: { type: integer }
        phone: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        branchId: { type: integer }
        phone: { type: string }
        status: { type: string }

    # Category
    Category:
      type: object
      required: [id, name, productCount]
      properties:
        id: { type: integer }
        name: { type: string }
