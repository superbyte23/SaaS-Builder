        email: { type: string }
        phone: { type: string }
        address: { type: string }
        birthday: { type: string }
        notes: { type: string }

    CustomerUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
