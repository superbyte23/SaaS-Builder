        currency: { type: string }
        timezone: { type: string }
        taxRate: { type: number }
        receiptHeader: { type: string }
        receiptFooter: { type: string }
        plan: { type: string }
        status: { type: string }

    # Branch
    Branch:
      type: object
      required: [id, organizationId, name, status, createdAt]
      properties:
        id: { type: integer }
