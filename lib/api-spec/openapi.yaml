      type: object
      properties:
        name: { type: string }
        description: { type: string }
        sku: { type: string }
        barcode: { type: string }
        price: { type: number }
        costPrice: { type: number }
        categoryId: { type: integer }
        unit: { type: string }
        taxRate: { type: number }
        image: { type: string }
        trackInventory: { type: boolean }
        reorderPoint: { type: integer }
        status: { type: string }

    # Inventory
    InventoryItem:
      type: object
      required: [id, productId, productName, branchId, quantity, updatedAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
