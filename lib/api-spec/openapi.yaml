        isMain: { type: boolean }
        taxRate: { type: number }

    BranchUpdate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        status: { type: string }
        taxRate: { type: number }

    # User
    User:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
